name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: intl
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run tests
        run: vendor/bin/phpunit

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Inject version into extension
        run: sed -i "s/version: '[^']*'/version: '${{ steps.version.outputs.version }}'/" DomainResellerApi/DomainResellerApi.php

      - name: Package extension
        run: zip -r "DomainResellerApi-${{ steps.version.outputs.version }}.zip" DomainResellerApi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: DomainResellerApi-${{ steps.version.outputs.version }}.zip
          generate_release_notes: true
